="none" stroke="#52616B" stroke-width="2" marker-end="url(#arrow)"/><text x="625" y="1392" font-family="Arial,sans-serif" font-size="13" fill="#52616B">Нет</text><polyline points="850,1400 850,1450" fill="none" stroke="#52616B" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="1425" font-family="Arial,sans-serif" font-size="13" fill="#52616B">Да</text><polyline points="850,1550 850,1594" fill="none" stroke="#52616B" stroke-width="2" marker-end="url(#arrow)"/><polyline points="850,1686 850,1716" fill="none" stroke="#52616B" stroke-width="2" marker-end="url(#arrow)"/><line x1="1065" y1="870" x2="1080" y2="870" stroke="#A68B45" stroke-width="1.5" stroke-dasharray="5,4"/><circle cx="850" cy="160" r="32" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><circle cx="850" cy="160" r="13" fill="none" stroke="#2E7D32" stroke-width="2"/><path d="M850,151 L850,160 L857,165" fill="none" stroke="#2E7D32" stroke-width="2"/><text x="898" y="152.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#23303A"><tspan x="898" dy="0">5-й рабочий день месяца,</tspan><tspan x="898" dy="16">следующего за отчётным</tspan></text><rect x="650.0" y="234.0" width="400" height="92" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="275.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Сформировать выгрузку из 1С</tspan><tspan x="850" dy="20">и применить мэппинг РСБУ → МСФО</tspan></text><polygon points="850.0,370.0 900.0,420.0 850.0,470.0 800.0,420.0" fill="#FFF7DF" stroke="#B3832E" stroke-width="2" filter="url(#shadow)"/><path d="M838.0,408.0 L862.0,432.0 M862.0,408.0 L838.0,432.0" stroke="#B3832E" stroke-width="3"/><text x="920" y="411.5" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#23303A"><tspan x="920" dy="0">Мэппинг и контрольные</tspan><tspan x="920" dy="17">суммы в порядке?</tspan></text><rect x="125.0" y="374.0" width="330" height="92" rx="12" fill="#FFFFFF" stroke="#A56A43" stroke-width="2" filter="url(#shadow)"/><text x="290" y="415.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="290" dy="0">Исправить мэппинг</tspan><tspan x="290" dy="20">или исходные данные</tspan></text><rect x="650.0" y="516.0" width="400" height="88" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="555.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Загрузить проводки</tspan><tspan x="850" dy="20">в Actual / HR Actual</tspan></text><rect x="120.0" y="644.0" width="340" height="92" rx="12" fill="#FFFFFF" stroke="#A56A43" stroke-width="2" filter="url(#shadow)"/><text x="290" y="685.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="290" dy="0">Выбрать периметр и версию</tspan><tspan x="290" dy="20">бюджета / прогноза</tspan></text><rect x="640.0" y="640.0" width="420" height="100" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="685.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Рассчитать начисления и соцвзносы:</tspan><tspan x="850" dy="20">1/3 квартальной и 1/12 годовой суммы</tspan></text><rect x="635.0" y="815.0" width="430" height="110" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="865.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Отнести выплаты к периодам начисления</tspan><tspan x="850" dy="20">и сформировать сторно (или нули)</tspan></text><rect x="635.0" y="1000.0" width="430" height="100" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="1045.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Повторить расчёт, сверить итоги</tspan><tspan x="850" dy="20">и проверить дубли HR Actual</tspan></text><polygon points="850.0,1140.0 900.0,1190.0 850.0,1240.0 800.0,1190.0" fill="#FFF7DF" stroke="#B3832E" stroke-width="2" filter="url(#shadow)"/><path d="M838.0,1178.0 L862.0,1202.0 M862.0,1178.0 L838.0,1202.0" stroke="#B3832E" stroke-width="3"/><text x="920" y="1181.5" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#23303A"><tspan x="920" dy="0">Контроли</tspan><tspan x="920" dy="17">пройдены?</tspan></text><rect x="120.0" y="1140.0" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#A56A43" stroke-width="2" filter="url(#shadow)"/><text x="290" y="1185.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="290" dy="0">Исправить данные / параметры</tspan><tspan x="290" dy="20">и повторить расчёт</tspan></text><rect x="120.0" y="1304.0" width="340" height="92" rx="12" fill="#FFFFFF" stroke="#A56A43" stroke-width="2" filter="url(#shadow)"/><text x="290" y="1345.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="290" dy="0">Проверить и утвердить</tspan><tspan x="290" dy="20">HR Actual</tspan></text><polygon points="850.0,1300.0 900.0,1350.0 850.0,1400.0 800.0,1350.0" fill="#FFF7DF" stroke="#B3832E" stroke-width="2" filter="url(#shadow)"/><path d="M838.0,1338.0 L862.0,1362.0 M862.0,1338.0 L838.0,1362.0" stroke="#B3832E" stroke-width="3"/><text x="920" y="1341.5" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#23303A"><tspan x="920" dy="0">HR Actual</tspan><tspan x="920" dy="17">утверждён?</tspan></text><rect x="625.0" y="1450.0" width="450" height="100" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="1495.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Передать HR-data в отчётные формы</tspan><tspan x="850" dy="20">и значения Finance по мэппингу</tspan></text><rect x="640.0" y="1594.0" width="420" height="92" rx="12" fill="#FFFFFF" stroke="#3F6F8F" stroke-width="2" filter="url(#shadow)"/><text x="850" y="1635.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#23303A"><tspan x="850" dy="0">Зафиксировать версию, журнал</tspan><tspan x="850" dy="20">и уведомить участников</tspan></text><circle cx="850" cy="1750" r="34" fill="#FFEBEE" stroke="#B64949" stroke-width="3"/><circle cx="850" cy="1750" r="25" fill="none" stroke="#B64949" stroke-width="1.5"/><text x="850" y="1808.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#23303A"><tspan x="850" dy="0">HR-факт закрыт</tspan></text><path d="M1080,750 h316 l24,24 v216 h-340 z" fill="#FFFDF5" stroke="#A68B45" stroke-width="1.5"/><path d="M1396,750 v24 h24" fill="none" stroke="#A68B45" stroke-width="1.5"/><text x="1092" y="774" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5C4B22">ПРАВИЛА ВЫПЛАТ И СТОРНО</text><text x="1092" y="791" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Есть выплата:</text><text x="1092" y="808" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">• cash и соцвзносы → период</text><text x="1092" y="825" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">  начисления;</text><text x="1092" y="842" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">• сторно = −начисления</text><text x="1092" y="859" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">  за 3 / 12 месяцев.</text><text x="1092" y="876" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Нет выплаты: сторно = 0.</text><text x="1092" y="893" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Февраль → декабрь ПГ (Q4)</text><text x="1092" y="910" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Май → март (Q1)</text><text x="1092" y="927" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Август → июнь (Q2)</text><text x="1092" y="944" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Ноябрь → сентябрь (Q3)</text><text x="1092" y="961" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">Годовой → декабрь ПГ</text><text x="1092" y="978" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#5C4B22">ПГ = предыдущий год</text></svg>